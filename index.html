<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Login — Security Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fafafa;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #262626;
    }

    .container {
      width: 350px;
    }

    .login-box {
      background: white;
      border: 1px solid #dbdbdb;
      padding: 40px;
      text-align: center;
    }

    .logo {
      font-family: cursive;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
      background: #fafafa;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: 0;
      border-radius: 7px;
      background: #0095f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0077c8;
    }

    .demo-message {
      display: none;
      margin-top: 20px;
      padding: 12px;
      background: #fff3cd;
      border: 1px solid #ffe69c;
      border-radius: 5px;
      color: #664d03;
      font-size: 13px;
      line-height: 1.5;
    }

    .notice {
      margin-top: 15px;
      text-align: center;
      font-size: 11px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="login-box">

      <div class="logo">Instagram</div>

      <form id="loginForm">

        <input
          id="username"
          type="text"
          placeholder="Phone number, username, or email"
          autocomplete="off"
        >

        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="off"
        >

        <button type="submit">Log in</button>

      </form>

      <div id="demoMessage" class="demo-message">
        🛡️ <strong>Security awareness demo</strong><br><br>
        This was a simulated login page.
        Your password was intentionally not collected, stored, or transmitted.
      </div>

    </div>

    <div class="notice">
      Educational phishing-awareness simulation
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      /*
       * SAFETY FEATURE:
       * We intentionally DO NOT read the password value.
       * It is never stored or sent anywhere.
       */

      const username = document.getElementById("username").value;

      console.log("Simulation login attempt for:", username);

      document.getElementById("demoMessage").style.display = "block";

      document.getElementById("password").value = "";
    });
  </script>

</body>
</html>
